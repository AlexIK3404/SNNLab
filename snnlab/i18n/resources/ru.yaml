      convergence: Сходимость ISI
      fi: f–I-кривая
      alpha: Порядок по α
      variability: Повторы
      summary: Сводка
    notes:
      convergence: 'Логарифмический график ошибки периода относительно Richardson-экстраполированного
        решения midpoint с малым dt. Наклон на трёх наименьших шагах даёт наблюдаемый порядок.'
      fi: 'Частота — число спайков в окне наблюдения, делённое на длительность окна.
        Она определена и при одном спайке; средний ISI тогда не определён.'
      alpha: 'Для композиции двух шагов Эйлера условия второго порядка: c₁+c₂=1 и
        c₁c₂=1/2. У вещественной пары решений нет; сопряжённая пара 1/2±iα удовлетворяет
        условию только при α=1/2. LTE-порядок — основной тест, ISI-порядок чувствительнее
        к конечному диапазону dt.'
      summary: 'Сравнивайте порядок вместе с ошибкой, дрейфом, устойчивостью и стоимостью:
        одной точности классификации для вывода о численном методе недостаточно.'
    table:
      method: Метод
      lte_order: Порядок LTE
      isi_event: ISI event
      isi_grid: ISI grid
      spike_counts: N / Nэт
      error: Ошибка ISI, мс
      drift: Дрейф, мс/с
      cost: Шаг*, нс
      status: Устойчивость
      ok: без расходимости
      diverged: 'расходимость: {count}'
    table_help:
      method: Численный метод из выбранного списка сравнения. Строка использует общие условия расчёта и выбранный для сравнения режим reset.
      lte_order: Порядок p гладкого шага вдали от reset, оценённый по локальной ошибке LTE ~ dt^(p+1). Характеризует интегратор, но сам по себе не предсказывает точность спайков.
      isi_event: Наклон зависимости ошибки межспайкового периода от dt при reset по событию. Период оценивается только по спайкам в окне наблюдения; этот столбец может быть контрольным.
      isi_grid: Наклон зависимости ошибки межспайкового периода от dt при reset на сетке. Период оценивается только по спайкам в окне наблюдения; округление времени спайка может ограничить наблюдаемый порядок.
      spike_counts: Число спайков метода на самом мелком выбранном dt / число спайков эталона. Считаются только спайки окна наблюдения. При несовпадении чисел дрейф не определяется.
      error: Абсолютная разница между периодом метода на самом мелком выбранном dt и экстраполированным эталонным периодом, мс. Оба периода оцениваются по спайкам окна наблюдения.
      drift: Модуль наклона разности времён соответствующих спайков метода и эталона за окно наблюдения, мс на модельную секунду. «—» означает, что сопоставление ненадёжно или спайков недостаточно.
      cost: Среднее время одного шага сетки в одном полном прогоне, включая переходный участок, проверку порога и reset. Для неявного Эйлера включает внутреннее дробление шага; число попыток показано во всплывающей подсказке ячейки. Это ориентировочная стоимость расчёта, а не повторный бенчмарк.
      status: Число значений dt, на которых расчёт разошёлся до конца полного прогона, включая переходный участок. «Без расходимости» означает лишь, что заданный порог устойчивости не был превышен.
    axes:
      time_ms: Время, мс
      voltage_mv: Потенциал v, мВ
