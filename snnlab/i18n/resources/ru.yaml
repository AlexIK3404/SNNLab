      close: Закрыть
    help:
      dt: Меньший dt обычно снижает численную ошибку, но увеличивает стоимость симуляции.
      reset: Grid reset округляет момент спайка до сетки и добавляет ошибку O(dt), не связанную с порядком интегратора.
      alpha: Для комплексной композиции теоретический второй порядок достигается при α=0.5.
    trace_metrics: '<b>Спайки:</b> {spikes} &nbsp; <b>Частота:</b> {rate} Гц &nbsp;
      <b>Средний ISI:</b> {isi} мс &nbsp; <b>CV(ISI):</b> {cv} &nbsp; <b>Расчёт:</b>
