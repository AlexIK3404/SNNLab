    notes:
      convergence: 'Log-log spike-period error relative to a small-step midpoint reference
        with Richardson extrapolation. The slope over the three smallest steps estimates
        the observed order.'
      fi: 'Rate is the number of spikes in the observation window divided by its
        duration. It is defined even for one spike; mean ISI is then undefined.'
      alpha: 'A two-stage Euler composition is second order when c₁+c₂=1 and c₁c₂=1/2.
        No real pair solves both conditions; the conjugate pair 1/2±iα does so only at
        α=1/2. LTE order is the primary test because finite-range ISI fits are more fragile.'
      summary: 'Interpret order together with error, drift, stability, and cost. End-task
        accuracy alone is not enough to characterize a numerical method.'
    table:
      method: Method
      lte_order: LTE order
      isi_event: ISI event
      isi_grid: ISI grid
      spike_counts: N / Nref
      error: ISI error, ms
      drift: Drift, ms/s
      cost: Step*, ns
      status: Stability
      ok: no divergence
      diverged: 'diverged: {count}'
    table_help:
      method: Numerical method from the selected comparison list. This row uses the shared conditions and the selected comparison reset mode.
      lte_order: Order p of a smooth step away from reset, estimated from local error LTE ~ dt^(p+1). It characterizes the integrator but does not by itself predict spike timing accuracy.
      isi_event: Slope of inter-spike-period error versus dt with event-corrected reset. The period uses spikes in the observation window only; this column may be the control.
      isi_grid: Slope of inter-spike-period error versus dt with grid reset. The period uses spikes in the observation window only; rounded spike timing can limit observed order.
      spike_counts: Number of method spikes at the finest selected dt / reference spikes. Only spikes in the observation window count. Drift is undefined if the counts differ.
      error: Absolute difference between the method period at the finest selected dt and the extrapolated reference period, in ms. Both use observation-window spikes.
      drift: Absolute slope of time differences between paired method and reference spikes in the observation window, ms per simulated second. A dash means matching was unreliable or spikes were insufficient.
      cost: Average time per grid step in a single full run, including the transient, threshold checks, and reset. Implicit Euler includes internal subdivision; hover over its cell for the number of attempts. This is an exploratory cost, not a repeated benchmark.
      status: Number of dt values that diverged before the end of the full run, including the transient. “No divergence” means only that the configured stability limit was not exceeded.
    axes:
      time_ms: Time, ms
      voltage_mv: Potential v, mV
      recovery: Recovery u
      isi_index: Interval number
      isi_deviation_ms: ISI deviation, ms
      dt_ms: Step dt, ms
      isi_error_ms: '|period error|, ms'
      current: Input current I
      rate_hz: Rate, Hz
      order: Observed order
      seed: Seed
    legend:
      local_order: Local-error order
      period_order: Spike-period order
      first_order: O(dt)
      second_order: O(dt²)
      v_nullcline: dv/dt = 0
      u_nullcline: du/dt = 0
    export:
      button: Save plot…
      title: Save plot as PNG or SVG
    view:
      button: View…
      tip: 'P — pan, Z — rectangle zoom; X/Y/B — axes; +/− — zoom; 0 — all data; F — expand; Ctrl+S — save. Wheel or right drag zooms.'
      both: Both axes
      x: X axis only
      y: Y axis only
      pan: Pan with mouse (P)
      rectangle: Zoom to rectangle (Z)
      reset: Show all data
      maximize: Expand plot
      window: Plot — expanded view
      close: Close
    help:
      dt: A smaller dt usually reduces numerical error but increases simulation cost.
      reset: Grid reset rounds spike time to the grid and adds an O(dt) error unrelated to integrator order.
      alpha: The complex composition reaches theoretical second order at α=0.5.
    trace_metrics: '<b>Spikes:</b> {spikes} &nbsp; <b>Rate:</b> {rate} Hz &nbsp;
      <b>Mean ISI:</b> {isi} ms &nbsp; <b>CV(ISI):</b> {cv} &nbsp; <b>Compute:</b>
      {runtime} ms (full run)'
